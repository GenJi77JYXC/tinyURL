name: tinyurl

# 生产环境配置（2C2G）
# 修改点：
# 1. postgres/redis 不暴露公网端口
# 2. app/prometheus 仅绑定 127.0.0.1（通过 Nginx 反代或 SSH 隧道访问）
# 3. 2C2G 内存紧张，去掉 Grafana（省 ~200MB），Prometheus UI 足够查指标
# 4. 各服务加了内存限制，防止 OOM 把系统拖垮
# 5. 请务必修改 app.environment.BASE_URL 为你的真实域名

services:
  postgres:
    image: postgres:16-alpine
    container_name: tinyurl-postgres
    environment:
      POSTGRES_USER: tinyurl
      # 生产环境务必改成强密码，并与 app.environment.DATABASE_URL 对齐
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tinyurl}
      POSTGRES_DB: tinyurl
    # 不暴露公网端口，仅容器间通信
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinyurl -d tinyurl"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: tinyurl-redis
    # 2G 机器上再压一下 Redis 内存
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 192M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tinyurl-app
    environment:
      GIN_MODE: release
      HTTP_ADDR: ":8080"
      # 生产域名（本地开发可通过 .env 覆盖为 http://localhost:8080）
      BASE_URL: ${BASE_URL:-https://tinyurl.mahiro.cloud}
      DATABASE_URL: postgres://tinyurl:${POSTGRES_PASSWORD:-tinyurl}@postgres:5432/tinyurl?sslmode=disable
      REDIS_ADDR: redis:6379
      CACHE_TTL: 1h
      NEGATIVE_CACHE_TTL: 1m
      RATE_LIMIT_RPS: "10"
      RATE_LIMIT_BURST: "5"
      # 生产环境只信任本机 Nginx
      TRUSTED_PROXIES: "127.0.0.1,::1"
    # 仅本机可访问，Nginx 反代到 127.0.0.1:8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: tinyurl-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=2GB'
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # Grafana：通过 Nginx 子路径 https://tinyurl.mahiro.cloud/grafana/ 访问
  grafana:
    image: grafana/grafana:11.2.0
    container_name: tinyurl-grafana
    environment:
      # 生产环境务必改强密码（从 .env 读）
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # 子路径部署必需的两项配置
      GF_SERVER_ROOT_URL: https://tinyurl.mahiro.cloud/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pgdata:
  redisdata:
  promdata:
